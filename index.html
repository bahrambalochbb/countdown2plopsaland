<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plopsaland & Eid Countdowns</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background:
        radial-gradient(circle at top left, rgba(66, 153, 225, 0.34), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(251, 191, 36, 0.36), transparent 28rem),
        linear-gradient(135deg, #eef7ff 0%, #fff8ec 100%);
    }

    main {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 56px 20px;
    }

    .hero {
      margin: 0 auto 34px;
      max-width: 780px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #2563eb;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.35rem, 7vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.07em;
    }

    .subtitle {
      margin: 18px auto 0;
      max-width: 620px;
      color: #516070;
      font-size: 1.08rem;
      line-height: 1.6;
    }

    .countdowns {
      display: grid;
      grid-template-columns: repeat(2, minmax(280px, 1fr));
      gap: 24px;
    }

    .frame {
      width: 100%;
      height: 170px;
      border: 0;
      overflow: hidden;
      border-radius: 18px;
      background: #fff;
    }

    .card {
      display: grid;
      gap: 18px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 24px 70px rgba(23, 32, 51, 0.14);
      backdrop-filter: blur(14px);
    }

    .card-header {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .icon {
      display: grid;
      width: 54px;
      height: 54px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 18px;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 1.35rem;
      font-weight: 900;
    }

    .icon.eid {
      background: #fef3c7;
      color: #92400e;
    }

    .title {
      margin: 0;
      color: #111827;
      font-size: 1.45rem;
      line-height: 1.1;
    }

    .description {
      margin: 6px 0 0;
      color: #64748b;
      font-size: 0.96rem;
      line-height: 1.45;
    }

    @media (max-width: 760px) {
      main {
        padding: 36px 14px;
      }

      .countdowns {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 18px;
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Two exciting countdowns</p>
      <h1 id="page-title">Plopsaland & Eid</h1>
      <p class="subtitle">
        Keep an eye on both special dates from one clean page.
      </p>
    </section>

    <section class="countdowns" aria-label="Countdowns">
      <article class="card">
        <div class="card-header">
          <span class="icon" aria-hidden="true">P</span>
          <div>
            <h2 class="title">Plopsaland Countdown</h2>
            <p class="description">Counting down to the Plopsaland trip.</p>
          </div>
        </div>
        <iframe
          class="frame"
          src="https://w2.countingdownto.com/7142964"
          scrolling="no"
          title="Plopsaland countdown"
        ></iframe>
      </article>

      <article class="card">
        <div class="card-header">
          <span class="icon eid" aria-hidden="true">E</span>
          <div>
            <h2 class="title">Eid Countdown</h2>
            <p class="description">Counting down to Eid celebrations.</p>
          </div>
        </div>
        <iframe
          class="frame"
          src="https://w2.countingdownto.com/7142977"
          scrolling="no"
          title="Eid countdown"
        ></iframe>
      </article>
    </section>
  </main>
</body>
</html>
